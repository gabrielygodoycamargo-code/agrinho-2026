<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Agrinho: Agro Forte e Sustentável</title>
    <style>
        :root {
            --cor-mel: #FFB703;
            --cor-mel-escuro: #FB8500;
            --cor-fundo: #FEFAE0;
            --cor-texto: #283618;
            --cor-verde: #606C38;
            --cor-verdadeiro: #2a9d8f;
            --cor-falso: #e63946;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* --- ENFEITES DE ABELHAS E MEL --- */
        .decoracao-mel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: repeating-linear-gradient(90deg, var(--cor-mel), var(--cor-mel) 30px, var(--cor-mel-escuro) 30px, var(--cor-mel-escuro) 60px);
            border-bottom: 8px solid var(--cor-texto);
            z-index: 1;
        }

        /* Gotas de mel caindo no topo */
        .decoracao-mel::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 10%;
            width: 40px;
            height: 40px;
            background: var(--cor-mel-escuro);
            border-radius: 0 0 50% 50%;
            box-shadow: 150px -10px 0 10px var(--cor-mel), 300px -5px 0 5px var(--cor-mel-escuro), 600px -15px 0 15px var(--cor-mel), 800px -20px 0 8px var(--cor-mel-escuro);
        }

        /* Grandes Abelhas Decorativas Fofas */
        .abelha-decorativa {
            position: fixed;
            font-size: 5rem;
            user-select: none;
            z-index: 0;
            filter: drop-shadow(3px 5px 5px rgba(0,0,0,0.2));
            animation: flutuar 4s ease-in-out infinite;
        }
        #abelha-esquerda { left: 5%; top: 20%; animation-delay: 0s; }
        #abelha-direita { right: 5%; bottom: 15%; animation-delay: 2s; transform: scaleX(-1); }

        @keyframes flutuar {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* --- CONTAINER PRINCIPAL DO JOGO --- */
        .container {
            background: rgba(255, 255, 255, 0.95);
            border: 6px solid var(--cor-mel);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            text-align: center;
            z-index: 10;
            position: relative;
            transition: all 0.3s ease;
        }

        .container::before {
            content: '🍯';
            position: absolute;
            top: -35px;
            left: calc(50% - 30px);
            font-size: 3.5rem;
        }

        h1 {
            color: var(--cor-verde);
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitulo {
            font-weight: bold;
            color: var(--cor-mel-escuro);
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        /* --- ÁREA DO QUIZ --- */
        .progresso {
            font-size: 0.9rem;
            background: var(--cor-verde);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .pergunta-box {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 30px;
            padding: 15px;
            background: #fdfdfd;
            border-radius: 15px;
            border-left: 5px solid var(--cor-mel);
        }

        /* --- BOTÕES --- */
        .botoes-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            border: none;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        .btn-verdadeiro { background-color: var(--cor-verdadeiro); }
        .btn-falso { background-color: var(--cor-falso); }
        
        .btn-reiniciar {
            background-color: var(--cor-verde);
            margin-top: 20px;
            display: none;
            margin-left: auto;
            margin-right: auto;
        }

        /* --- FEEDBACK VISUAL --- */
        .feedback {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 30px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .correto { color: var(--cor-verdadeiro); }
        .incorreto { color: var(--cor-falso); }

        /* --- TELA FINAL --- */
        .resultado-final {
            display: none;
        }

        .resultado-final h2 {
            font-size: 2.2rem;
            color: var(--cor-mel-escuro);
