<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Agrinho: Agro Forte e Sustentável</title>
    <style>
        :root {
            --cor-mel: #FFB703;
            --cor-mel-escuro: #FB8500;
            --cor-fundo: #FEFAE0;
            --cor-texto: #283618;
            --cor-verde: #606C38;
            --cor-verdadeiro: #2a9d8f;
            --cor-falso: #e63946;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* --- ENFEITES DE ABELHAS E MEL --- */
        .decoracao-mel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: repeating-linear-gradient(90deg, var(--cor-mel), var(--cor-mel) 30px, var(--cor-mel-escuro) 30px, var(--cor-mel-escuro) 60px);
            border-bottom: 8px solid var(--cor-texto);
            z-index: 1;
        }

        /* Gotas de mel caindo no topo */
        .decoracao-mel::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 10%;
            width: 40px;
            height: 40px;
            background: var(--cor-mel-escuro);
            border-radius: 0 0 50% 50%;
            box-shadow: 150px -10px 0 10px var(--cor-mel), 300px -5px 0 5px var(--cor-mel-escuro), 600px -15px 0 15px var(--cor-mel), 800px -20px 0 8px var(--cor-mel-escuro);
        }

        /* Grandes Abelhas Decorativas Fofas */
        .abelha-decorativa {
            position: fixed;
            font-size: 5rem;
            user-select: none;
            z-index: 0;
            filter: drop-shadow(3px 5px 5px rgba(0,0,0,0.2));
            animation: flutuar 4s ease-in-out infinite;
        }
        #abelha-esquerda { left: 5%; top: 20%; animation-delay: 0s; }
        #abelha-direita { right: 5%; bottom: 15%; animation-delay: 2s; transform: scaleX(-1); }

        @keyframes flutuar {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* --- CONTAINER PRINCIPAL DO JOGO --- */
        .container {
            background: rgba(255, 255, 255, 0.95);
            border: 6px solid var(--cor-mel);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            text-align: center;
            z-index: 10;
            position: relative;
            transition: all 0.3s ease;
        }

        .container::before {
            content: '🍯';
            position: absolute;
            top: -35px;
            left: calc(50% - 30px);
            font-size: 3.5rem;
        }

        h1 {
            color: var(--cor-verde);
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitulo {
            font-weight: bold;
            color: var(--cor-mel-escuro);
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        /* --- ÁREA DO QUIZ --- */
        .progresso {
            font-size: 0.9rem;
            background: var(--cor-verde);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .pergunta-box {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 30px;
            padding: 15px;
            background: #fdfdfd;
            border-radius: 15px;
            border-left: 5px solid var(--cor-mel);
        }

        /* --- BOTÕES --- */
        .botoes-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            border: none;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        .btn-verdadeiro { background-color: var(--cor-verdadeiro); }
        .btn-falso { background-color: var(--cor-falso); }
        
        .btn-reiniciar {
            background-color: var(--cor-verde);
            margin-top: 20px;
            display: none;
            margin-left: auto;
            margin-right: auto;
        }

        /* --- FEEDBACK VISUAL --- */
        .feedback {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 30px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .correto { color: var(--cor-verdadeiro); }
        .incorreto { color: var(--cor-falso); }

        /* --- TELA FINAL --- */
        .resultado-final {
            display: none;
        }

        .resultado-final h2 {
            font-size: 2.2rem;
            color: var(--cor-mel-escuro);
            margin-bottom: 15px;
        }

        .pontuacao {
            font-size: 3rem;
            font-weight: bold;
            color: var(--cor-verde);
            margin: 20px 0;
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .abelha-decorativa { display: none; }
            .container { padding: 25px 15px; }
            .botoes-container { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="decoracao-mel"></div>
    <div class="abelha-decorativa" id="abelha-esquerda">🐝</div>
    <div class="abelha-decorativa" id="abelha-direita">🐝</div>

    <div class="container" id="quiz-container">
        
        <div id="jogo-ativo">
            <h1>Quiz Agrinho 2026</h1>
            <p class="subtitulo">Agro forte, futuro sustentável 🌾</p>
            
            <div class="progresso" id="contador-progresso">Pergunta 1 de 7</div>
            
            <div class="pergunta-box" id="texto-pergunta">
                Carregando pergunta...
            </div>
            
            <div class="botoes-container">
                <button class="btn btn-verdadeiro" onclick="verificarResposta(true)">👍 Verdadeiro</button>
                <button class="btn btn-falso" onclick="verificarResposta(false)">👎 Falso</button>
            </div>

            <div class="feedback" id="feedback-resposta"></div>
        </div>

        <div id="jogo-concluido" class="resultado-final">
            <h2>Missão Cumprida! 🍯</h2>
            <p>Você ajudou a nossa abelha a entender melhor o equilíbrio entre a produção e o meio ambiente!</p>
            <div class="pontuacao" id="pontuacao-texto">0 / 0</div>
            <p id="mensagem-elogio" style="font-weight: bold; margin-bottom: 20px;"></p>
            <button class="btn btn-reiniciar" id="btn-reiniciar" onclick="reiniciarJogo()">Jogar Novamente 🔄</button>
        </div>

    </div>

    <script>
        // Banco de dados de perguntas focadas no tema do Agrinho
        const perguntas = [
            {
                texto: "As abelhas são fundamentais para o agro sustentável porque são responsáveis pela polinização de grande parte das culturas agrícolas.",
                resposta: true,
                explicacao: "Correto! Sem as abelhas, a produção de alimentos e a biodiversidade seriam severamente afetadas."
            },
            {
                texto: "O plantio direto na palha aumenta a erosão do solo e polui os rios locais.",
                resposta: false,
                explicacao: "Falso! O plantio direto protege o solo contra a erosão e conserva a umidade da terra."
            },
            {
                texto: "A tecnologia dos drones e sensores ajuda a economizar água e aplicar insumos apenas onde a planta realmente necessita.",
                resposta: true,
                explicacao: "Exato! Isso se chama Agricultura de Precisão, reduzindo o desperdício."
            },
            {
                texto: "Para garantir o equilíbrio ambiental, as propriedades rurais devem manter áreas de Reserva Legal e Preservação Permanente (APPs).",
                resposta: true,
                explicacao: "Perfeito! Essas áreas protegem as fontes de água e a fauna local."
            },
            {
                texto: "A rotação de culturas desgasta os nutrientes do solo de forma mais rápida do que plantar a mesma cultura todo ano.",
                resposta: false,
                explicacao: "Falso! A rotação de culturas melhora a saúde do solo e quebra o ciclo de pragas."
            },
            {
                texto: "O controle biológico utiliza inimigos naturais (como insetos benéficos) para combater pragas sem agredir o meio ambiente.",
                resposta: true,
                explicacao: "Isso mesmo! É uma alternativa altamente sustentável aos defensivos químicos químicos."
            },
            {
                texto: "Sustentabilidade no campo significa focar apenas na preservação da floresta, deixando de lado a produtividade econômica do produtor rural.",
                resposta: false,
                explicacao: "Falso! O verdadeiro agro sustentável equilibra a conservação ambiental com a viabilidade econômica e o desenvolvimento social."
            }
        ];

        let indicePerguntaAtual = 0;
        let pontuacao = 0;
        let respondido = false;

        const elementoPergunta = document.getElementById("texto-pergunta");
        const elementoProgresso = document.getElementById("contador-progresso");
        const elementoFeedback = document.getElementById("feedback-resposta");
        const telaJogoAtivo = document.getElementById("jogo-ativo");
        const telaJogoConcluido = document.getElementById("jogo-concluido");
        const elementoPontuacao = document.getElementById("pontuacao-texto");
        const elementoElogio = document.getElementById("mensagem-elogio");
        const btnReiniciar = document.getElementById("btn-reiniciar");

        function carregarPergunta() {
            respondido = false;
            elementoFeedback.style.opacity = "0";
            
            if (indicePerguntaAtual < perguntas.length) {
                elementoProgresso.innerText = `Pergunta ${indicePerguntaAtual + 1} de ${perguntas.length}`;
                elementoPergunta.innerText = perguntas[indicePerguntaAtual].texto;
            } else {
                mostrarResultadoFinal();
            }
        }

        function verificarResposta(respostaUsuario) {
            if (respondido) return; // Evita cliques múltiplos na mesma pergunta
            respondido = true;

            const perguntaAtual = perguntas[indicePerguntaAtual];
            
            if (respostaUsuario === perguntaAtual.resposta) {
                pontuacao++;
                elementoFeedback.innerText = "⭐ " + perguntaAtual.explicacao;
                elementoFeedback.className = "feedback correto";
            } else {
                elementoFeedback.innerText = "❌ " + perguntaAtual.explicacao;
                elementoFeedback.className = "feedback incorreto";
            }
            
            elementoFeedback.style.opacity = "1";

            // Avança para a próxima pergunta após 3.5 segundos para dar tempo de ler o feedback
            setTimeout(() => {
                indicePerguntaAtual++;
                carregarPergunta();
            }, 3500);
        }

        function mostrarResultadoFinal() {
            telaJogoAtivo.style.display = "none";
            telaJogoConcluido.style.display = "block";
            btnReiniciar.style.display = "block";
            
            elementoPontuacao.innerText = `${pontuacao} de ${perguntas.length}`;
            
            if (pontuacao === perguntas.length) {
                elementoElogio.innerText = "Incrível! Você é um mestre da sustentabilidade no campo! 👑🌾";
            } else if (pontuacao >= Math.ceil(perguntas.length / 2)) {
                elementoElogio.innerText = "Muito bom! Você entende bem como equilibrar produção e natureza! 🐝";
            } else {
                elementoElogio.innerText = "Continue estudando! O futuro do nosso planeta depende desse equilíbrio. 💚";
            }
        }

        function reiniciarJogo() {
            indicePerguntaAtual = 0;
            pontuacao = 0;
            telaJogoConcluido.style.display = "none";
            btnReiniciar.style.display = "none";
            telaJogoAtivo.style.display = "block";
            carregarPergunta();
        }

        // Inicia o jogo assim que a página carrega
        window.onload = carregarPergunta;
    </script>
</body>
</html>
